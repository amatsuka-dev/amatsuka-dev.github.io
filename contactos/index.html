<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amatsuka Creators</title><link rel="stylesheet" href="../css/style.css"><script>try{var t=localStorage.getItem("tema");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><link rel="stylesheet" href="../css/tema.css">
<style>
/* Contactos: temporalmente "Próximamente". El formulario anterior quedó guardado en contactos-anterior.html */
.pronto{min-height:calc(100dvh - 190px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:20px 0 60px}
.pronto h1{margin:0;font-size:clamp(40px,9vw,104px);line-height:1;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.pronto .tag{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;opacity:.85}

</style></head><body class="red"><main><section class="pronto"><span class="tag"><i></i>Contactos</span><h1>Próximamente</h1></section></main>
