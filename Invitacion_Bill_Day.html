<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>Bill’s Day · Invitación</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600&display=swap">
<style>
/* Fuente pixel del diseño: si tienes el archivo, ponlo en fonts/bills-day.ttf y se usa solo.
   Si no, se usa Pixelify Sans (Google Fonts) y por último una monoespaciada. */
@font-face{font-family:'BillPixel';src:url(../fonts/bills-day.ttf) format('truetype');font-display:swap}
:root{--fondo:#ffffff;--tinta:#491a2c;--rojo:#a42c35;--crema:#f7f6ea;--d:clamp(58px,14vmin,92px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  /* Blanco + SVG de fondo */
  background:var(--fondo) url("/assets/bgred.svg") center/cover no-repeat;
  font-family:'BillPixel','Pixelify Sans','Courier New',monospace;
  color:var(--tinta);overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;
}

/* Escena 3D: el lienzo ocupa toda la pantalla. No hay controles de órbita: el modelo no se puede girar */
#escena{position:fixed;inset:0;outline:none;touch-action:manipulation}
#escena:focus-visible #lienzo{outline:3px solid var(--rojo);outline-offset:-6px}
#lienzo{display:block;width:100%;height:100%;background:transparent}

/* Mensajes de carga / error */
.estado{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:clamp(15px,2.6vw,22px);
  letter-spacing:.06em;font-weight:500;padding:0 24px;pointer-events:none;transition:opacity .4s}
.estado small{display:block;margin-top:10px;font-size:.7em;opacity:.7;letter-spacing:.02em}
.estado[hidden]{display:none}
.listo .estado{opacity:0}

/* Pista */
.pista{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + max(18px,6dvh));text-align:center;
  font-size:clamp(15px,2.6vw,22px);letter-spacing:.06em;font-weight:500;pointer-events:none;opacity:0;transition:opacity .35s}
.pista i{display:block;width:14px;height:14px;margin:0 auto 8px;border-left:3px solid var(--tinta);border-top:3px solid var(--tinta);transform:rotate(45deg);animation:sube 1.1s ease-in-out infinite}
@keyframes sube{50%{transform:rotate(45deg) translate(-5px,-5px);opacity:.5}}
.listo .pista{opacity:1}
.abierta .pista{opacity:0}

/* Logo de Amatsuka Creators, abajo a la derecha (con margen, no pegado a las esquinas) */
.logo{position:fixed;z-index:4;right:max(20px,4.5vw);bottom:calc(env(safe-area-inset-bottom,0px) + max(22px,5.5dvh));
  width:clamp(84px,12vw,170px);height:auto;display:block;pointer-events:none;opacity:0;transition:opacity .6s .2s}
.listo .logo{opacity:1}

/* Botón de Discord: aparece cuando la animación Open termina */
.dc{position:fixed;z-index:5;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + max(16px,4.5dvh));width:var(--d);height:var(--d);
  transform:translateX(-50%);display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--crema);border:3px solid var(--rojo);
  box-shadow:0 calc(var(--d)*.064) calc(var(--d)*.176) rgba(36,11,21,.45),0 0 0 calc(var(--d)*.08) rgba(164,44,53,.22);
  visibility:hidden;pointer-events:none;transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s}
.dc img{width:56%;height:56%;display:block;pointer-events:none}
.fin .dc{visibility:visible;pointer-events:auto;animation:pop .7s cubic-bezier(.3,1.6,.5,1) backwards,late 2.4s ease-in-out .7s infinite}
.fin .dc:hover,.fin .dc:focus-visible{transform:translateX(-50%) scale(1.12) rotate(-4deg);outline:none;animation:none;
  box-shadow:0 calc(var(--d)*.096) calc(var(--d)*.24) rgba(36,11,21,.55),0 0 0 calc(var(--d)*.112) rgba(164,44,53,.4)}
.fin .dc:active{transform:translateX(-50%) scale(.96)}
.dc[hidden]{display:none}


@keyframes pop{from{transform:translateX(-50%) scale(0) rotate(-40deg);opacity:0}}
@keyframes late{50%{box-shadow:0 calc(var(--d)*.064) calc(var(--d)*.176) rgba(36,11,21,.45),0 0 0 calc(var(--d)*.176) rgba(164,44,53,.1)}}

@media(prefers-reduced-motion:reduce){
  .pista i{animation:none}
  .fin .dc{animation:none}
}
</style></head>
<body>

<div id="escena" role="button" tabindex="0" aria-label="Abrir la invitación">
  <canvas id="lienzo"></canvas>
</div>
<p class="estado" id="estado">Cargando invitación…</p>
<img class="logo" src="../assets/logored.svg" alt="Amatsuka Creators" draggable="false" onerror="this.style.display='none'">
<p class="pista" id="pista"><i></i>Toca para abrir</p>

<a class="dc" id="dc" href="#" target="_blank" rel="noopener noreferrer" aria-label="Unirse al servidor de Discord" title="Unirse al servidor de Discord" hidden>
  <img src="../assets/redes/discord.svg" alt="">
</a>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
/* ============================================================
   >>> AQUÍ CAMBIAS EL ENLACE DE DISCORD <<<
   Pega entre las comillas el link de invitación de tu servidor.
   Si lo dejas vacío (""), el botón de Discord no aparece.
   Esta página NO está enlazada en el menú: solo entra quien tenga su dirección.
   ============================================================ */
var ENLACE_DISCORD = "https://discord.gg/RqD3BkYV";

/* Ruta del modelo 3D (el .gltf ya trae las texturas dentro, no necesita más archivos) */
var MODELO = "../assets/invitaiconAmatsuka-limpio.gltf";   /* versión con los bordes de las texturas limpios (sin halos negros ni blancos) */

/* Por qué lado de la tarjeta se ve el modelo: -1 = de frente (la cara del sobre con el sello).
   Si algún día la ves "por detrás", cambia a 1. */
var LADO_FRENTE = -1;

/* Tamaño del modelo YA ABIERTO en pantalla: FRAC_ALTO = qué parte del alto ocupa (más bajo = más pequeño);
   MARGEN_ANCHO = aire a los lados (más alto = más pequeño en pantallas angostas, como el celular) */
var FRAC_ALTO = .74, MARGEN_ANCHO = 1.12;

/* Sobre CERRADO: pequeño y centrado en la pantalla.
   FRAC_CERRADO = qué parte del alto de la pantalla ocupa el sobre (.41 = como tu imagen de referencia);
   MARGEN_CERRADO = aire a los lados en pantallas angostas (celular) */
var FRAC_CERRADO = .41, MARGEN_CERRADO = 1.7;

/* Fondo: blanco con el SVG encima (se dibuja dentro de la escena 3D) */
var FONDO_SVG = "/assets/bgred.svg";

/* Sonidos: al abrir suena opencard.ogg y al cerrar closecard.ogg. Ajusta la ruta si los pones en otra carpeta */
var SONIDO_ABRIR = "../assets/opencard.ogg";
var SONIDO_CERRAR = "../assets/closecard.ogg";
/* Volumen de los efectos de sonido (0 a 1) */
var VOLUMEN_SFX = .7;

/* Al abrir, la cámara se aleja suave para que quepa la carta que sube (no gira nada). false = cámara siempre quieta */
var ALEJAR_AL_ABRIR = true;

(function(){
  /* ---------- Botón de Discord ---------- */
  var u=String(ENLACE_DISCORD||"").trim(),a=document.getElementById("dc");
  if(u&&!/^https?:\/*$/i.test(u)){a.href=/^https?:/i.test(u)?u:"https://"+u;a.hidden=false}

  var body=document.body,esc=document.getElementById("escena"),lienzo=document.getElementById("lienzo"),
      msg=document.getElementById("estado"),reducido=false;
  try{reducido=window.matchMedia("(prefers-reduced-motion: reduce)").matches}catch(_){}

  function fallo(t,s){msg.hidden=false;msg.innerHTML=t+(s?"<small>"+s+"</small>":"");body.classList.remove("listo")}

  if(!window.THREE||!THREE.GLTFLoader){fallo("No se pudo cargar la invitación","Revisa tu conexión a internet e inténtalo de nuevo.");return}

  /* ---------- Sonidos (archivos .ogg) ---------- */
  var sAbrir=new Audio(SONIDO_ABRIR),sCerrar=new Audio(SONIDO_CERRAR);
  sAbrir.preload="auto";sCerrar.preload="auto";
  sAbrir.volume=VOLUMEN_SFX;sCerrar.volume=VOLUMEN_SFX;
  function reproducir(au){
    try{au.currentTime=0;var p=au.play();if(p&&p.catch)p.catch(function(){})}catch(_){}
  }
  function sfxAbrir(){reproducir(sAbrir)}
  function sfxCerrar(){reproducir(sCerrar)}
  function sfxFin(){}
  function sfxCerrada(){}

  /* ---------- Renderer ---------- */
  var renderer;
  try{renderer=new THREE.WebGLRenderer({canvas:lienzo,antialias:true,alpha:false})}
  catch(e){fallo("Tu navegador no pudo mostrar la invitación 3D","Prueba con otro navegador.");return}
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  /* Lienzo OPACO (igual que tu versión original): así la carta se ve exactamente igual, sin halos en los bordes.
     El color viene de --fondo (blanco) */
  var fondoCss="#ffffff";
  try{fondoCss=getComputedStyle(document.documentElement).getPropertyValue("--fondo").trim()||fondoCss}catch(_){}
  renderer.setClearColor(new THREE.Color(fondoCss),1);

  var escenaGL=new THREE.Scene();
  var FOV=20;

  /* Fondo: blanco + SVG encima, con comportamiento "cover" (rellena la pantalla sin deformarse) */
  var fondoTex=null,fondoAsp=1;
  function fondoCubrir(){
    if(!fondoTex)return;
    var asp=W/H,rx=1,ry=1;
    if(asp>fondoAsp){ry=fondoAsp/asp}else{rx=asp/fondoAsp}
    fondoTex.repeat.set(rx,ry);fondoTex.offset.set((1-rx)/2,(1-ry)/2);
  }
  (function(){
    var img=new Image();
    img.onload=function(){
      try{
        var nw=img.naturalWidth,nh=img.naturalHeight;
        fondoAsp=(nw>0&&nh>0)?nw/nh:1;
        var M=2048,cw=fondoAsp>=1?M:Math.round(M*fondoAsp),ch=fondoAsp>=1?Math.round(M/fondoAsp):M;
        var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;
        var cx=cv.getContext("2d");
        cx.fillStyle="#ffffff";cx.fillRect(0,0,cw,ch);   /* base blanca */
        cx.drawImage(img,0,0,cw,ch);                      /* SVG encima */
        fondoTex=new THREE.CanvasTexture(cv);
        fondoTex.encoding=THREE.sRGBEncoding;
        fondoTex.generateMipmaps=false;fondoTex.minFilter=THREE.LinearFilter;fondoTex.magFilter=THREE.LinearFilter;
        escenaGL.background=fondoTex;
        fondoCubrir();redibujar();
      }catch(_){}
    };
    img.src=FONDO_SVG;
  })();

  var camera=new THREE.PerspectiveCamera(FOV,1,.1,100);

  /* ---------- Luces ---------- */
  /* Las luces están calibradas para que, de frente, la suma sea ~1: así los colores se ven IGUALES a la textura
     (el rojo del sobre coincide con el fondo) y al moverse las partes aparece un poco de sombreado */
  var luzAmb=new THREE.AmbientLight(0xffffff,.64);                 /* base */
  var luzKey=new THREE.DirectionalLight(0xffffff,.30);             /* principal, arriba a la izquierda */
  var luzRell=new THREE.DirectionalLight(0xffffff,.14);            /* relleno por el otro lado */
  escenaGL.add(luzAmb,luzKey,luzRell);

  /* ---------- Estado ---------- */
  var gltf,modelo,mixer,aClose,aOpen,durOpen=0;
  var encCerrado,encFinal,encActual;     /* encuadres (centro y tamaño) cerrado / abierto */
  var abierta=false,cerrando=false,finalizada=false,camTermina=true,tCam0=0,camA,camB,corriendo=false,W=1,H=1;
  var CENTRO_Y=.435;                      /* ya abierta: el centro del modelo queda a 42% desde arriba (sobra sitio abajo para el botón) */
  var CENTRO_CERRADO=.5;                 /* cerrada: el sobre queda justo en el centro */
  var reloj=new THREE.Clock(),cajaCerrada,cajaAbierta;

  function encuadre(box,f,m,py){
    var c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3());
    return {cx:c.x,cy:c.y,cz:c.z,w:s.x,h:s.y,f:f,m:m,py:py};
  }

  /* Cámara siempre de frente: solo se mueve sobre el eje Z, nunca rota alrededor del modelo */
  function aplicar(s){
    var asp=W/H,
        hw=Math.max(s.h/(2*s.f),s.w*s.m/(2*asp)),
        dist=hw/Math.tan(THREE.MathUtils.degToRad(FOV/2)),
        camY=s.cy-(.5-s.py)*2*hw;
    camera.aspect=asp;
    camera.position.set(s.cx,camY,s.cz+LADO_FRENTE*dist);
    camera.lookAt(s.cx,camY,s.cz);
    camera.near=Math.max(.1,dist-6);camera.far=dist+8;   /* rango corto = sin parpadeos entre capas finitas */
    camera.updateProjectionMatrix();camera.updateMatrixWorld(true);
    /* luces por el lado de la cámara */
    var z=s.cz+LADO_FRENTE*6;
    luzKey.position.set(-2.5,4,z);
    luzRell.position.set(3,1,s.cz+LADO_FRENTE*5);
  }

  function medir(clip,t){
    var c=modelo.clone(true),m=new THREE.AnimationMixer(c),ac=m.clipAction(clip);
    ac.setLoop(THREE.LoopOnce,1);ac.clampWhenFinished=true;ac.play();m.update(t);
    c.updateMatrixWorld(true);
    return new THREE.Box3().setFromObject(c);
  }

  function redibujar(){renderer.render(escenaGL,camera)}

  function ajustarTamano(){
    W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);
    renderer.setSize(W,H,false);
    fondoCubrir();
    if(encActual){aplicar(encActual);redibujar()}
  }

  var ease=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
  function mezcla(a,b,k){return {cx:a.cx+(b.cx-a.cx)*k,cy:a.cy+(b.cy-a.cy)*k,cz:a.cz+(b.cz-a.cz)*k,w:a.w+(b.w-a.w)*k,h:a.h+(b.h-a.h)*k,
    f:a.f+(b.f-a.f)*k,m:a.m+(b.m-a.m)*k,py:a.py+(b.py-a.py)*k}}

  function frame(){
    var dt=Math.min(reloj.getDelta(),.1);
    mixer.update(dt);
    if(!camTermina){
      var k=Math.min(1,Math.max(0,(performance.now()-tCam0)/1700));
      encActual=mezcla(camA,camB,ease(k));aplicar(encActual);
      if(k>=1)camTermina=true;
    }
    redibujar();
    /* cerrada: sigue corriendo para mostrar el movimiento de Close; abierta: se detiene al terminar */
    if((!abierta&&!reducido)||!(finalizada&&camTermina)){requestAnimationFrame(frame)}else{corriendo=false}
  }
  function moverCam(a,b,espera){camA=a;camB=b;camTermina=false;tCam0=performance.now()+espera}
  function correr(){if(corriendo)return;corriendo=true;reloj.getDelta();requestAnimationFrame(frame)}

  /* ---------- Abrir / Cerrar ---------- */
  function abrir(){
    if(abierta||!mixer)return;
    abierta=true;cerrando=false;finalizada=false;body.classList.add("abierta");
    esc.setAttribute("aria-label","Cerrar la invitación");
    try{if(navigator.vibrate)navigator.vibrate(25)}catch(_){}
    aOpen.reset();aOpen.timeScale=1;aOpen.setLoop(THREE.LoopOnce,1);aOpen.clampWhenFinished=true;aOpen.play();
    sfxAbrir();
    if(reducido){
      aOpen.time=durOpen;encActual=encFinal;aplicar(encActual);
    }else{
      aOpen.crossFadeFrom(aClose,.2,false);
      if(ALEJAR_AL_ABRIR)moverCam(encCerrado,encFinal,150);
    }
    correr();
  }

  /* Cerrar: la animación Open se reproduce al revés y vuelve a la pose Close */
  function cerrar(){
    if(!abierta||!finalizada||cerrando)return;
    cerrando=true;finalizada=false;body.classList.remove("fin");sfxCerrar();
    aOpen.reset();aOpen.timeScale=-1;aOpen.setLoop(THREE.LoopOnce,1);aOpen.clampWhenFinished=true;
    aOpen.time=reducido?0:durOpen;aOpen.play();
    if(reducido){encActual=encCerrado;aplicar(encActual)}
    else if(ALEJAR_AL_ABRIR)moverCam(encFinal,encCerrado,0);
    correr();
  }
  function yaCerrada(){
    cerrando=false;abierta=false;
    body.classList.remove("abierta");
    esc.setAttribute("aria-label","Abrir la invitación");
    aClose.reset();aClose.play();if(reducido)aClose.paused=true;aClose.crossFadeFrom(aOpen,.2,false);
    sfxCerrada();
    finalizada=false;setTimeout(function(){finalizada=true},320);   /* deja terminar el fundido a la pose Close */
    correr();
  }

  /* ¿El clic cayó sobre la tarjeta? (rectángulo de la tarjeta en pantalla; b = caja cerrada o abierta) */
  var v3=new THREE.Vector3();
  function sobreTarjeta(ev,b){
    var r=lienzo.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top,
        minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
    for(var i=0;i<8;i++){
      v3.set(i&1?b.max.x:b.min.x,i&2?b.max.y:b.min.y,i&4?b.max.z:b.min.z).project(camera);
      var sx=(v3.x+1)/2*r.width,sy=(1-v3.y)/2*r.height;
      if(sx<minx)minx=sx;if(sx>maxx)maxx=sx;if(sy<miny)miny=sy;if(sy>maxy)maxy=sy;
    }
    return x>=minx&&x<=maxx&&y>=miny&&y<=maxy;
  }
  /* Clic en la tarjeta: cerrada → abre; abierta (cuando ya terminó de abrir) → cierra */
  function alternar(){if(!abierta)abrir();else cerrar()}
  esc.addEventListener("click",function(e){
    if(!cajaCerrada)return;
    if(!abierta){if(sobreTarjeta(e,cajaCerrada))abrir()}
    else if(finalizada&&!cerrando&&sobreTarjeta(e,cajaAbierta))cerrar();
  });
  esc.addEventListener("pointermove",function(e){
    if(!cajaCerrada)return;
    var activa=!abierta?sobreTarjeta(e,cajaCerrada):(finalizada&&!cerrando&&sobreTarjeta(e,cajaAbierta));
    esc.style.cursor=activa?"pointer":"default";
  });
  esc.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();alternar()}});

  var tRs;window.addEventListener("resize",function(){clearTimeout(tRs);tRs=setTimeout(ajustarTamano,60)});

  /* ---------- Cargar el modelo ---------- */
  new THREE.GLTFLoader().load(MODELO,function(g){
    gltf=g;modelo=g.scene;escenaGL.add(modelo);

    /* Texturas: el modelo las trae sin suavizado (pixeladas y parpadeando al achicar); se pasan a mipmaps */
    var aniso=renderer.capabilities.getMaxAnisotropy();
    modelo.traverse(function(o){
      if(!o.isMesh)return;
      var ms=Array.isArray(o.material)?o.material:[o.material];
      ms.forEach(function(m){
        if(m.map){m.map.minFilter=THREE.LinearMipmapLinearFilter;m.map.magFilter=THREE.LinearFilter;
          m.map.generateMipmaps=true;m.map.anisotropy=aniso;m.map.needsUpdate=true}
        m.side=THREE.FrontSide;
      });
    });

    /* Animaciones por nombre (sin importar mayúsculas): "close" = pose estática, "open" = al hacer clic */
    var clipClose=null,clipOpen=null;
    g.animations.forEach(function(c){var n=String(c.name).toLowerCase();if(n==="close")clipClose=c;else if(n==="open")clipOpen=c});
    if(!clipOpen||!clipClose){fallo("El modelo no trae las animaciones Open y Close","Animaciones encontradas: "+(g.animations.map(function(c){return c.name}).join(", ")||"ninguna"));return}
    durOpen=clipOpen.duration;

    /* Encuadres: tarjeta cerrada y tarjeta abierta (con la carta arriba) */
    cajaCerrada=medir(clipClose,0);
    cajaAbierta=medir(clipOpen,durOpen);
    var uni=cajaCerrada.clone().union(cajaAbierta);
    encCerrado=encuadre(cajaCerrada,FRAC_CERRADO,MARGEN_CERRADO,CENTRO_CERRADO);
    encFinal=encuadre(uni,FRAC_ALTO,MARGEN_ANCHO,CENTRO_Y);
    if(!ALEJAR_AL_ABRIR){encCerrado=encFinal}
    encActual=encCerrado;

    /* Pose estática: primer fotograma de Close, congelado */
    mixer=new THREE.AnimationMixer(modelo);
    aClose=mixer.clipAction(clipClose);aClose.setLoop(THREE.LoopRepeat,Infinity);aClose.play();
    if(reducido)aClose.paused=true;   /* con "reducir movimiento" se queda quieta */
    aOpen=mixer.clipAction(clipOpen);
    mixer.update(0);
    mixer.addEventListener("finished",function(e){
      if(e.action!==aOpen)return;
      if(cerrando){setTimeout(yaCerrada,0)}   /* fuera del update del mixer, para no mover acciones a mitad de cuadro */
      else{finalizada=true;body.classList.add("fin");sfxFin()}
    });

    ajustarTamano();
    msg.hidden=true;body.classList.add("listo");correr();
    if(/[?&]abierta\b/.test(location.search))abrir();   /* opcional: invitacion/?abierta la muestra ya abierta */
  },undefined,function(){
    fallo("No se pudo cargar la invitación","Comprueba que el archivo del modelo esté en "+MODELO+" y que la página se abra desde tu sitio web.");
  });

  ajustarTamano();
})();
</script>
</body></html>
